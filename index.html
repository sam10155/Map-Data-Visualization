<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Canada Industrial Capacity Viewer</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="css/style.css" />
  <script>
    // Cache-buster: append ?v=<mtime-ish> to all subsequent local script/css.
    // Python's SimpleHTTPServer doesn't send useful cache headers, so the
    // browser aggressively caches stale JS. Bump APP_VERSION on each deploy.
    window.APP_VERSION = '20260622o';
    document.write('<style>/* v='+APP_VERSION+' */</style>');
  </script>
</head>
<body>
  <div id="map"></div>
  <div id="controlPanel" class="control-panel">
    <div class="panel-header" onclick="togglePanel()">
      <span>🗺️ Layer Controls</span>
      <span id="toggleIcon">−</span>
    </div>
    <div class="panel-content">
      <div class="stats-box">
        <div><strong>Facilities</strong></div>
        <div>Showing <span id="visibleCount">0</span> of <span id="totalCount">0</span></div>
      </div>
      <div class="section">
        <div class="section-title">📊 Datasets</div>
        <div id="datasetFilters"></div>
      </div>
      <div class="section">
        <div class="section-title">🏭 Sectors </div>
        <div id="sectorFilters"></div>
      </div>
      <button class="download-btn" onclick="downloadCSV()">⬇️ Download Visible Facilities</button>
    </div>
  </div>
  <div id="viewToggle">
    <button id="toggleViewBtn">📊 Table View</button>
  </div>
  
  <div class="legend">
    <div class="legend-title">Sector Legend</div>
    <div style="font-size: 11px; color: #6b7280; margin-bottom: 8px;">Circle size = capacity</div>
    <div id="legendContent"></div>
  </div>
  <div id="toastContainer" class="toast-container"></div>
  <div id="tableView" class="hidden">
    <div id="tableControls">
      <label>Province:</label>
      <select id="provinceFilter"><option value="">All</option></select>
      <label>Sector:</label>
      <select id="sectorFilter"><option value="">All</option></select>
      <label>Subcategory:</label>
      <select id="subcategoryFilter"><option value="">All</option></select>
      <input type="text" id="searchBox" placeholder="Search by name or city...">
      <button id="exportCsv">⬇️ Export CSV</button>
    </div>
    <table id="dataTable">
      <thead><tr id="tableHeader"></tr></thead>
      <tbody></tbody>
    </table>
  </div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    (function(){
      var v = '?v=' + (window.APP_VERSION || Date.now());
      [
        'data/config.js',
        'data/canada-data.js',
        'data/canada-water-basins.js',
        'data/canada-ports-airports.js',
        'data/canada-power.js',
        'data/canada-pipelines.js',
        'js/constants.js',
        'js/metrics.js',
        'js/edit.js',
        'js/map.js',
        'js/tableview.js',
        'js/filters.js',
        'js/ui.js',
        'js/aggregate.js',
        'js/download.js',
        'js/search.js',
        'js/mapmodes.js',
        'js/layers/weather.js',
        'js/layers/water.js',
        'js/layers/transport.js',
        'js/layers/landuse.js',
        'js/layers/power.js',
        'js/layers/pipelines.js',
        'js/layers/tracking.js',
        'js/main.js'
      ].forEach(function(s){ document.write('<script src="'+s+v+'"><\/script>'); });
    })();
  </script>
</body>
</html>
