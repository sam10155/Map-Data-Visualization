name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # SECURE MODE (recommended): only TRACKING_PROXY (a public worker URL)
      # is written to config.js. API keys live as Cloudflare Worker secrets
      # and are never shipped to the browser.
      #
      # DIRECT MODE: if you don't deploy a worker, also set AISSTREAM_API_KEY
      # and GFW_API_TOKEN as repo secrets — they'll be embedded client-side
      # (visible via View Source). Both are free/rotatable, so this is
      # acceptable but not "secret" in any real sense.
      - name: Generate data/config.js
        env:
          TRACKING_PROXY:    ${{ secrets.TRACKING_PROXY }}
          AISSTREAM_API_KEY: ${{ secrets.AISSTREAM_API_KEY }}
          GFW_API_TOKEN:     ${{ secrets.GFW_API_TOKEN }}
        # Use a Python script so secret values are JSON-escaped and never
        # pass through shell interpolation (a secret containing `$(…)` or
        # backticks would otherwise be executed by `echo "…"`).
        shell: python
        run: |
          import json, os
          out = ['// AUTO-GENERATED at deploy time.']
          proxy = os.environ.get('TRACKING_PROXY', '').strip()
          if proxy:
              out.append(f'window.TRACKING_PROXY = {json.dumps(proxy)};')
          else:
              for k in ('AISSTREAM_API_KEY', 'GFW_API_TOKEN'):
                  v = os.environ.get(k, '').strip()
                  if v:
                      out.append(f'window.{k} = {json.dumps(v)};')
          with open('data/config.js', 'w') as f:
              f.write('\n'.join(out) + '\n')
          print(f"config.js: {sum(len(l)+1 for l in out)}b · "
                f"proxy={'set' if proxy else '-'} "
                f"ais={'set' if os.environ.get('AISSTREAM_API_KEY') else '-'} "
                f"gfw={'set' if os.environ.get('GFW_API_TOKEN') else '-'}")

      - name: Stamp APP_VERSION (SHA + run number for cache-busting on re-runs)
        run: |
          V="${GITHUB_SHA::8}-${GITHUB_RUN_NUMBER}"
          sed -i "s/window.APP_VERSION = '[^']*'/window.APP_VERSION = '${V}'/" index.html
          echo "APP_VERSION=${V}"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
